<!DOCTYPE html>
<html lang="en-GB">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in or create your Smart BethG account.">
    <title>Log in - Smart BethG</title>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#08111f">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <div class="auth-shell">
        <div class="auth-card">
            <p class="eyebrow">Smart BethG</p>
            <h1 id="authTitle">Log in to Smart BethG</h1>

            <form id="authForm">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input class="form-control" type="text" id="username" name="username" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="password-field">
                        <input type="password" id="password" name="password" autocomplete="current-password" minlength="8" required class="form-control password-input">
                        <button type="button" id="togglePassword" aria-label="Show password" title="Show password"
                            class="password-toggle">
                            <i class="fa-solid fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                    <p class="form-help">At least 8 characters.</p>
                </div>

                <p class="auth-error" id="authError" role="alert"></p>

                <button type="submit" class="btn btn-primary btn-block" id="authSubmit">Log in</button>
                <a href="#" class="auth-toggle" id="authModeToggle">Need an account? Create one</a>
            </form>

            <div id="googleAuthDivider" class="auth-divider" hidden>
                <div class="auth-divider-line"></div>
                <span>or</span>
                <div class="auth-divider-line"></div>
            </div>

            <a href="/auth/google/login" id="googleAuthButton" class="google-auth-button" hidden>
                <i class="fa-brands fa-google" aria-hidden="true"></i>
                Continue with Google
            </a>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
    <script src="{{ url_for('static', filename='js/register-sw.js') }}"></script>
</body>

</html>
