<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - Smart BethG</title>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#08111f">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        .auth-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            padding: 24px;
        }
        .auth-card {
            width: 100%;
            max-width: 380px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg, 12px);
            padding: 32px;
        }
        .auth-card h1 {
            color: var(--text-primary);
            font-size: var(--text-2xl);
            margin: 0 0 4px;
        }
        .auth-card .eyebrow {
            color: var(--text-secondary);
            font-size: var(--text-sm);
            margin: 0 0 20px;
        }
        .auth-error {
            color: var(--danger);
            font-size: var(--text-sm);
            min-height: 18px;
            margin-top: 4px;
        }
        .auth-toggle {
            display: inline-block;
            margin-top: 14px;
            color: var(--accent);
            font-size: var(--text-sm);
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="auth-shell">
        <div class="auth-card">
            <p class="eyebrow">Smart BethG</p>
            <h1 id="authTitle">Log in to Smart BethG</h1>

            <form id="authForm">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input class="form-control" type="text" id="username" name="username" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control" type="password" id="password" name="password" autocomplete="current-password" minlength="8" required>
                    <p class="form-help">At least 8 characters.</p>
                </div>

                <div class="form-group" id="inviteCodeGroup" style="display:none;">
                    <label class="form-label" for="inviteCode">Invite code</label>
                    <input class="form-control" type="text" id="inviteCode" name="inviteCode" autocomplete="off">
                    <p class="form-help">Only needed if this deployment requires one.</p>
                </div>

                <p class="auth-error" id="authError" role="alert"></p>

                <button type="submit" class="btn btn-primary" id="authSubmit" style="width:100%;">Log in</button>
                <a href="#" class="auth-toggle" id="authModeToggle">Need an account? Create one</a>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
    <script src="{{ url_for('static', filename='js/register-sw.js') }}"></script>
</body>

</html>
