<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08111f"><title>Profile · Smart BethG</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/approved-design.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/subpages.css') }}"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"></head>
<body class="bethg-subpage"><main class="subpage-shell"><header class="subpage-header"><a class="subpage-back" href="/" aria-label="Back to Home"><i class="fa-solid fa-chevron-left"></i></a><h1>Profile</h1><span class="subpage-spacer"></span></header><section class="subpage-content profile-content">
<div class="profile-card"><span class="profile-avatar">{{ display_name[:1]|upper }}</span><div><h2>{{ display_name }}</h2><p>{{ account_email|default("Email not available") }}</p></div></div>
<section class="profile-info"><p class="subpage-section-label">ACCOUNT</p><div class="profile-field"><span>Username</span><strong>{{ account_username }}</strong></div><div class="profile-field"><span>Account eligibility</span><strong>18+ only</strong></div><div class="profile-field"><span>Account security</span><strong>Signed-in session</strong></div></section>
<a class="setting-link" href="/settings"><i class="fa-solid fa-gear"></i><span>Settings</span><i class="fa-solid fa-chevron-right"></i></a><a class="setting-link" href="/workspace/privacy"><i class="fa-solid fa-shield-halved"></i><span>Data &amp; privacy</span><i class="fa-solid fa-chevron-right"></i></a>
</section></main><script src="{{ url_for('static', filename='js/preferences.js') }}" defer></script></body></html>
