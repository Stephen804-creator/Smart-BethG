<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08111f"><title>Artifacts · Smart BethG</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/approved-design.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/subpages.css') }}"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"></head>
<body class="bethg-subpage"><main class="subpage-shell"><header class="subpage-header"><a class="subpage-back" href="/" aria-label="Back to Home"><i class="fa-solid fa-chevron-left"></i></a><h1>Artifacts</h1><span class="subpage-spacer"></span></header>
<section class="subpage-content artifact-page"><aside class="artifact-library"><p class="subpage-section-label">YOUR ARTIFACTS</p><div id="artifactList" class="artifact-list"><p class="subpage-muted">Loading artifacts…</p></div></aside>
<section class="artifact-workspace" aria-live="polite"><div class="artifact-toolbar"><div class="artifact-tabs" role="tablist" aria-label="Artifact view"><button class="is-selected" data-view="preview" role="tab" aria-selected="true">Preview</button><button data-view="code" role="tab" aria-selected="false">Code</button></div><button class="artifact-menu-button" id="artifactMenuButton" type="button" aria-label="Artifact actions" aria-expanded="false"><i class="fa-solid fa-ellipsis"></i></button><div class="artifact-actions-menu" id="artifactActionsMenu" hidden><button id="artifactDownload"><i class="fa-solid fa-download"></i> Download</button><button id="artifactCopyLink"><i class="fa-solid fa-link"></i> Copy link</button><button disabled title="GitHub export is not connected to this artifact screen yet"><i class="fa-brands fa-github"></i> Export to GitHub · unavailable</button></div></div>
<div id="artifactEmpty" class="subpage-empty">Choose an artifact to preview it.</div><div id="artifactViewer" class="artifact-viewer" hidden><h2 id="artifactTitle"></h2><div id="artifactPreview" class="artifact-preview" role="tabpanel"></div><div id="artifactCode" class="artifact-code" role="tabpanel" hidden><div class="artifact-file-list"><button id="artifactFileButton" class="is-selected" type="button"><i class="fa-regular fa-file-code"></i><span id="artifactFileName"></span></button></div><pre><code id="artifactCodeText"></code></pre></div></div><p id="artifactStatus" class="subpage-muted" role="status"></p></section></section></main><script src="{{ url_for('static', filename='js/preferences.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/artifacts-page.js') }}" defer></script></body></html>
