# Smart BethG Render Blueprint
# Secrets are intentionally not stored in Git. Set the unsynced values in Render.
# Note: the Free web-service plan has an ephemeral filesystem. Do not treat local
# uploads/artifacts as durable production storage; configure a persistent disk or
# shared object storage before relying on them.
#
# Deploy rule: Render deploys ONLY the `production` branch. Agents and developers
# commit to `main`; a change goes live only when `main` is merged into `production`
# (open a pull request main -> production and review it first).

services:
  - type: web
    name: smart-bethg
    runtime: python
    plan: free
    region: oregon
    branch: production
    buildCommand: pip install -r requirements.txt -r requirements-c2pa.txt
    startCommand: uvicorn main_fastapi:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SMART_BETHG_ENV
        value: production
      - key: SMART_BETHG_SESSION_HTTPS_ONLY
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SMART_BETHG_SECRET_KEY
        sync: false
      - key: SMART_BETHG_C2PA_SIGN_CERT_PEM
        sync: false
      - key: SMART_BETHG_C2PA_SIGN_PRIVATE_KEY_PEM
        sync: false
      - key: SMART_BETHG_C2PA_SIGN_ALGORITHM
        value: PS256
      - key: SMART_BETHG_C2PA_TSA_URL
        sync: false
      - key: SMART_BETHG_C2PA_TRUST_ANCHORS_PEM
        sync: false
      - key: SMART_BETHG_C2PA_TRUST_CONFIG
        value: 1.3.6.1.4.1.62558.2.1
