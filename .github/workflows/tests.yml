name: Smart BethG tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Run unit tests
        env:
          SMART_BETHG_ENV: test
          SMART_BETHG_SECRET_KEY: ci-test-secret-key-not-for-production
          SMART_BETHG_STORAGE_ROOT: ${{ runner.temp }}/smart-bethg-storage
        run: python -m unittest discover -s tests -p "test_*.py" -v

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smartbethg
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: smartbethg_test
        ports:
          - 5432:5432
    env:
      SMART_BETHG_ENV: test
      SMART_BETHG_SECRET_KEY: ci-test-secret-key-not-for-production
      SMART_BETHG_STORAGE_ROOT: ${{ github.workspace }}/.test-storage
      DATABASE_URL: postgresql://smartbethg:ci-only-password@localhost:5432/smartbethg_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U smartbethg -d smartbethg_test; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready" >&2
          exit 1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Run PostgreSQL integration tests
        run: python -m unittest tests.test_postgres_integration -v
