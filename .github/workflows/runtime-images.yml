name: Smart BethG isolated runtime images

on:
  push:
    paths:
      - "execution-images/**"
      - "services/runtime_registry.py"
      - "services/sandbox_service.py"
      - "scripts/verify_runtime_image.py"
      - ".github/workflows/runtime-images.yml"
  pull_request:
    paths:
      - "execution-images/**"
      - "services/runtime_registry.py"
      - "services/sandbox_service.py"
      - "scripts/verify_runtime_image.py"
      - ".github/workflows/runtime-images.yml"
  workflow_dispatch:
    inputs:
      publish_images:
        description: Publish the verified runtime images to this repository's GHCR namespace
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Build and execute ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runtime: python
            dockerfile: execution-images/python/Dockerfile
          - runtime: javascript
            dockerfile: execution-images/javascript/Dockerfile
          - runtime: typescript
            dockerfile: execution-images/typescript/Dockerfile
          - runtime: java
            dockerfile: execution-images/java/Dockerfile
          - runtime: c
            dockerfile: execution-images/c/Dockerfile
          - runtime: cpp
            dockerfile: execution-images/cpp/Dockerfile
          - runtime: go
            dockerfile: execution-images/go/Dockerfile
          - runtime: rust
            dockerfile: execution-images/rust/Dockerfile
          - runtime: csharp
            dockerfile: execution-images/csharp/Dockerfile
          - runtime: php
            dockerfile: execution-images/php/Dockerfile
          - runtime: dart
            dockerfile: execution-images/dart/Dockerfile
          - runtime: kotlin
            dockerfile: execution-images/kotlin/Dockerfile
          - runtime: swift
            dockerfile: execution-images/swift/Dockerfile
          - runtime: bash
            dockerfile: execution-images/bash/Dockerfile
          - runtime: powershell
            dockerfile: execution-images/powershell/Dockerfile
          - runtime: ruby
            dockerfile: execution-images/ruby/Dockerfile
          - runtime: elixir
            dockerfile: execution-images/elixir/Dockerfile
          - runtime: r
            dockerfile: execution-images/r/Dockerfile
          - runtime: julia
            dockerfile: execution-images/julia/Dockerfile
          - runtime: lua
            dockerfile: execution-images/lua/Dockerfile
          - runtime: perl
            dockerfile: execution-images/perl/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the PostgreSQL driver required by the application modules
        run: python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"

      - name: Build runtime image
        env:
          RUNTIME: ${{ matrix.runtime }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: docker build --pull --file "$DOCKERFILE" --tag "smartbethg/runtime:$RUNTIME" "execution-images/$RUNTIME"

      - name: Scan runtime image for known critical and high vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: smartbethg/runtime:${{ matrix.runtime }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Execute the registered runtime command inside its restricted container
        env:
          SMART_BETHG_ENV: test
          SMART_BETHG_SECRET_KEY: runtime-image-ci-only
          RUNTIME: ${{ matrix.runtime }}
        run: python scripts/verify_runtime_image.py --runtime "$RUNTIME" --image "smartbethg/runtime:$RUNTIME"

  publish:
    name: Publish verified ${{ matrix.runtime }} image
    if: github.event_name == 'workflow_dispatch' && inputs.publish_images == true
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runtime: python
            dockerfile: execution-images/python/Dockerfile
          - runtime: javascript
            dockerfile: execution-images/javascript/Dockerfile
          - runtime: typescript
            dockerfile: execution-images/typescript/Dockerfile
          - runtime: java
            dockerfile: execution-images/java/Dockerfile
          - runtime: c
            dockerfile: execution-images/c/Dockerfile
          - runtime: cpp
            dockerfile: execution-images/cpp/Dockerfile
          - runtime: go
            dockerfile: execution-images/go/Dockerfile
          - runtime: rust
            dockerfile: execution-images/rust/Dockerfile
          - runtime: csharp
            dockerfile: execution-images/csharp/Dockerfile
          - runtime: php
            dockerfile: execution-images/php/Dockerfile
          - runtime: dart
            dockerfile: execution-images/dart/Dockerfile
          - runtime: kotlin
            dockerfile: execution-images/kotlin/Dockerfile
          - runtime: swift
            dockerfile: execution-images/swift/Dockerfile
          - runtime: bash
            dockerfile: execution-images/bash/Dockerfile
          - runtime: powershell
            dockerfile: execution-images/powershell/Dockerfile
          - runtime: ruby
            dockerfile: execution-images/ruby/Dockerfile
          - runtime: elixir
            dockerfile: execution-images/elixir/Dockerfile
          - runtime: r
            dockerfile: execution-images/r/Dockerfile
          - runtime: julia
            dockerfile: execution-images/julia/Dockerfile
          - runtime: lua
            dockerfile: execution-images/lua/Dockerfile
          - runtime: perl
            dockerfile: execution-images/perl/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the PostgreSQL driver required by the application modules
        run: python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, attach SBOM/provenance, and publish immutable commit tag
        id: build
        uses: docker/build-push-action@v6
        with:
          context: execution-images/${{ matrix.runtime }}
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/stephen804-creator/smart-bethg-runtime-${{ matrix.runtime }}:${{ github.sha }}

      - name: Pull the published image by immutable digest
        env:
          RUNTIME: ${{ matrix.runtime }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: docker pull "ghcr.io/stephen804-creator/smart-bethg-runtime-$RUNTIME@$IMAGE_DIGEST"

      - name: Smoke-test the exact published digest
        env:
          SMART_BETHG_ENV: test
          SMART_BETHG_SECRET_KEY: runtime-image-ci-only
          RUNTIME: ${{ matrix.runtime }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: python scripts/verify_runtime_image.py --runtime "$RUNTIME" --image "ghcr.io/stephen804-creator/smart-bethg-runtime-$RUNTIME@$IMAGE_DIGEST"

      - name: Record immutable image digest
        env:
          RUNTIME: ${{ matrix.runtime }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "### $RUNTIME" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/stephen804-creator/smart-bethg-runtime-$RUNTIME@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
